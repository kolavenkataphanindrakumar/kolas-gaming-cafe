<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kola's Gaming Cafe | Book a Session</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    .header {
      background: #161b22;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      color: #d0d7de;
    }

    .content {
      padding: 25px;
    }

    .info-box {
      background: #f1f3f5;
      border-radius: 12px;
      padding: 18px;
      line-height: 1.8;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .slots {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .slot {
      padding: 15px 10px;
      border: 2px solid #ddd;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-size: 15px;
    }

    .slot:hover:not(:disabled) {
      border-color: #161b22;
    }

    .slot.selected {
      background: #161b22;
      color: white;
      border-color: #161b22;
    }

    .slot.booked {
      background: #e9ecef;
      color: #888;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .book-button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .book-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      line-height: 1.8;
    }

    .success {
      background: #e9f9ee;
    }

    .error {
      background: #ffe9e9;
    }

    .whatsapp {
      display: inline-block;
      margin-top: 20px;
      color: #128c7e;
      font-weight: bold;
      text-decoration: none;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .slots {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🎮 Kola's Gaming Cafe</h1>
    <p>Book your gaming session in Palvancha</p>
  </div>

  <div class="content">

    <div class="info-box">
      ⏰ Open: Monday–Sunday, 10:00 AM–5:00 PM<br>
      🎮 Session duration: 60 minutes<br>
      💰 Price: ₹150 per hour<br>
      💵 Payment: Pay at the café<br>
      👤 One customer per time slot
    </div>

    <label for="date">Select Date</label>
    <input type="date" id="date">

    <label>Select Your Gaming Time</label>

    <div class="slots">

      <button class="slot" data-time="10:00 AM - 11:00 AM">
        10:00 AM - 11:00 AM
      </button>

      <button class="slot" data-time="11:00 AM - 12:00 PM">
        11:00 AM - 12:00 PM
      </button>

      <button class="slot" data-time="12:00 PM - 1:00 PM">
        12:00 PM - 1:00 PM
      </button>

      <button class="slot" data-time="1:00 PM - 2:00 PM">
        1:00 PM - 2:00 PM
      </button>

      <button class="slot" data-time="2:00 PM - 3:00 PM">
        2:00 PM - 3:00 PM
      </button>

      <button class="slot" data-time="3:00 PM - 4:00 PM">
        3:00 PM - 4:00 PM
      </button>

      <button class="slot" data-time="4:00 PM - 5:00 PM">
        4:00 PM - 5:00 PM
      </button>

    </div>

    <label for="name">Customer Name</label>
    <input
      type="text"
      id="name"
      placeholder="Enter your name"
      maxlength="60"
    >

    <label for="phone">WhatsApp Number</label>
    <input
      type="tel"
      id="phone"
      placeholder="Enter your 10-digit mobile number"
      maxlength="10"
      inputmode="numeric"
    >

    <button class="book-button" id="bookButton">
      Confirm Booking
    </button>

    <div class="message" id="message"></div>

    <a
      class="whatsapp"
      href="https://wa.me/918247617695"
      target="_blank"
      rel="noopener"
    >
      Need to cancel or reschedule? Contact us on WhatsApp
    </a>

  </div>

  <div class="footer">
    Kola's Gaming Cafe • Palvancha
  </div>

</div>

<script>

  // Your Supabase project details
  const SUPABASE_URL =
    "https://kjmovuvkfpqxbpgjscxb.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_jIkmH9FJEJ3ITWovdQvYmw_IDSkSeT2";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

  const dateInput =
    document.getElementById("date");

  const slots =
    document.querySelectorAll(".slot");

  const nameInput =
    document.getElementById("name");

  const phoneInput =
    document.getElementById("phone");

  const bookButton =
    document.getElementById("bookButton");

  const messageBox =
    document.getElementById("message");

  let selectedTime = "";

  // Prevent past dates
  const today = new Date();

  today.setMinutes(
    today.getMinutes() - today.getTimezoneOffset()
  );

  dateInput.min =
    today.toISOString().split("T")[0];


  // Select a time slot
  slots.forEach(slot => {

    slot.addEventListener("click", () => {

      if (slot.disabled) return;

      slots.forEach(item => {
        item.classList.remove("selected");
      });

      slot.classList.add("selected");

      selectedTime =
        slot.dataset.time;

    });

  });


  // Load booked slots from Supabase
  dateInput.addEventListener(
    "change",
    loadBookings
  );


  async function loadBookings() {

    selectedTime = "";

    slots.forEach(slot => {

      slot.classList.remove(
        "selected",
        "booked"
      );

      slot.disabled = false;

    });

    const selectedDate =
      dateInput.value;

    if (!selectedDate) return;

    showMessage(
      "Loading available slots...",
      "success"
    );

    const {
      data,
      error
    } = await supabaseClient
      .from("bookings")
      .select("booking_time")
      .eq(
        "booking_date",
        selectedDate
      );

    if (error) {

      showMessage(
        "Could not load bookings. Please try again.",
        "error"
      );

      console.error(error);

      return;

    }

    const bookedTimes =
      data.map(
        booking => booking.booking_time
      );

    slots.forEach(slot => {

      if (
        bookedTimes.includes(
          slot.dataset.time
        )
      ) {

        slot.classList.add("booked");

        slot.disabled = true;

      }

    });

    hideMessage();

  }


  // Create booking
  bookButton.addEventListener(
    "click",
    bookSlot
  );


  async function bookSlot() {

    const bookingDate =
      dateInput.value;

    const customerName =
      nameInput.value.trim();

    const phone =
      phoneInput.value.trim();

    if (!bookingDate) {

      showMessage(
        "Please select a date.",
        "error"
      );

      return;

    }

    if (!selectedTime) {

      showMessage(
        "Please select a gaming time.",
        "error"
      );

      return;

    }

    if (!customerName) {

      showMessage(
        "Please enter your name.",
        "error"
      );

      return;

    }

    if (
      !/^[6-9][0-9]{9}$/.test(phone)
    ) {

      showMessage(
        "Please enter a valid 10-digit Indian mobile number.",
        "error"
      );

      return;

    }

    bookButton.disabled = true;

    bookButton.textContent =
      "Booking...";

    const {
      error
    } = await supabaseClient
      .from("bookings")
      .insert({

        booking_date:
          bookingDate,

        booking_time:
          selectedTime,

        customer_name:
          customerName,

        phone:
          phone

      });

    bookButton.disabled = false;

    bookButton.textContent =
      "Confirm Booking";

    if (error) {

      // PostgreSQL unique-constraint error
      if (error.code === "23505") {

        showMessage(
          "Sorry, this slot was just booked by another customer. Please choose another time.",
          "error"
        );

        await loadBookings();

        return;

      }

      showMessage(
        "Booking could not be completed. Please try again.",
        "error"
      );

      console.error(error);

      return;

    }

    showMessage(

      `✅ <strong>Booking Confirmed!</strong><br>
      Customer: ${escapeHtml(customerName)}<br>
      Date: ${bookingDate}<br>
      Time: ${selectedTime}<br>
      Duration: 60 minutes<br>
      Price: ₹150<br>
      Payment: Pay at the café`,

      "success"

    );

    nameInput.value = "";

    phoneInput.value = "";

    await loadBookings();

  }


  function showMessage(
    text,
    type
  ) {

    messageBox.innerHTML =
      text;

    messageBox.className =
      "message " + type;

    messageBox.style.display =
      "block";

  }


  function hideMessage() {

    messageBox.style.display =
      "none";

  }


  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text;

    return div.innerHTML;

  }

</script>

</body>
</html>
