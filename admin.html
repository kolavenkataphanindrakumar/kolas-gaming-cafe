<body>

  <div class="container">

    <h1>🎮 Kola's Gaming Cafe</h1>

    <!-- LOGIN SECTION -->
    <div id="loginBox" class="login">

      <h2>Owner Login</h2>

      <input
        type="password"
        id="password"
        placeholder="Enter owner password"
      >

      <button
        class="login-button"
        onclick="login()"
      >
        Login
      </button>

      <div
        id="loginMessage"
        class="message"
      ></div>

    </div>


    <!-- ADMIN DASHBOARD -->
    <div
      id="dashboard"
      style="display: none;"
    >

      <button
        class="refresh-button"
        onclick="loadBookings()"
      >
        Refresh
      </button>

      <div
        id="message"
        class="message"
      ></div>

      <div
        id="summary"
        class="summary"
      >
        Loading bookings...
      </div>


      <h2>Today's Bookings</h2>

      <div class="table-container">

        <table>

          <thead>
            <tr>
              <th>Time</th>
              <th>Customer</th>
              <th>Phone</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="todayList">
          </tbody>

        </table>

      </div>


      <h2>All Bookings</h2>

      <div class="table-container">

        <table>

          <thead>
            <tr>
              <th>Date</th>
              <th>Time</th>
              <th>Customer</th>
              <th>Phone</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="allList">
          </tbody>

        </table>

      </div>

    </div>

  </div>


<script>

  /*
    SUPABASE SETTINGS
  */

  const SUPABASE_URL =
    "https://kjmovuvkfpqxbpgjscxb.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_jIkmH9FJEJ3ITWovdQvYmw_IDSkSeT2";


  /*
    IMPORTANT:
    Replace CHANGE_ME with your own admin password.
  */

  const ADMIN_PASSWORD =
    "phani";


  /*
    CREATE SUPABASE CLIENT

    The explicit apikey header is included to fix:
    "No API key found in request"
  */

  const db =
    window.supabase.createClient(

      SUPABASE_URL,

      SUPABASE_KEY,

      {
        global: {
          headers: {
            apikey: SUPABASE_KEY
          }
        },

        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false
        }
      }

    );


  /*
    LOGIN
  */

  function login() {

    const enteredPassword =
      document
        .getElementById("password")
        .value;

    if (
      enteredPassword ===
      ADMIN_PASSWORD
    ) {

      document
        .getElementById("loginBox")
        .style.display =
        "none";

      document
        .getElementById("dashboard")
        .style.display =
        "block";

      loadBookings();

    }

    else {

      showLoginMessage(
        "Wrong password.",
        "error"
      );

    }

  }


  /*
    ALLOW ENTER KEY TO LOGIN
  */

  document
    .getElementById("password")
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          login();

        }

      }
    );


  /*
    LOAD BOOKINGS
  */

  async function loadBookings() {

    showMessage(
      "Loading bookings...",
      "success"
    );


    const {
      data,
      error
    } = await db

      .from("bookings")

      .select("*")

      .order(
        "booking_date",
        {
          ascending: true
        }
      )

      .order(
        "booking_time",
        {
          ascending: true
        }
      );


    if (error) {

      console.error(
        "Load error:",
        error
      );

      showMessage(
        "Unable to load bookings: " +
        escapeHtml(
          error.message
        ),
        "error"
      );

      return;

    }


    const today =
      getLocalDate();


    const todayBookings =
      data.filter(
        booking =>
          booking.booking_date ===
          today
      );


    const activeTodayBookings =
      todayBookings.filter(
        booking =>
          booking.status !==
          "Cancelled"
      );


    const todayRevenue =
      activeTodayBookings.length *
      150;


    document
      .getElementById("summary")
      .innerHTML =

      `
      <strong>Today's date:</strong>
      ${formatDate(today)}
      <br>

      <strong>Today's bookings:</strong>
      ${todayBookings.length}
      <br>

      <strong>Active bookings:</strong>
      ${activeTodayBookings.length}
      <br>

      <strong>Today's expected revenue:</strong>
      ₹${todayRevenue}
      `;


    renderTodayBookings(
      todayBookings
    );


    renderAllBookings(
      data
    );


    showMessage(
      "Bookings loaded successfully.",
      "success"
    );

  }


  /*
    SHOW TODAY'S BOOKINGS
  */

  function renderTodayBookings(
    bookings
  ) {

    const todayList =
      document
        .getElementById(
          "todayList"
        );


    if (
      bookings.length === 0
    ) {

      todayList.innerHTML =

        `
        <tr>
          <td
            colspan="5"
          >
            No bookings today.
          </td>
        </tr>
        `;

      return;

    }


    let html = "";


    bookings.forEach(
      booking => {

        const phone =
          String(
            booking.phone
          )
          .replace(
            /\D/g,
            ""
          );


        const whatsappMessage =
          encodeURIComponent(

            `Hello ${booking.customer_name}, this is Kola's Gaming Cafe. Your gaming booking is for ${formatDate(booking.booking_date)} from ${booking.booking_time}.`

          );


        html +=

        `
        <tr>

          <td>
            ${escapeHtml(
              booking.booking_time
            )}
          </td>

          <td>
            ${escapeHtml(
              booking.customer_name
            )}
          </td>

          <td>
            ${escapeHtml(
              phone
            )}
          </td>

          <td>
            <span
              class="
              status
              ${statusClass(
                booking.status
              )}
              "
            >
              ${escapeHtml(
                booking.status ||
                "Booked"
              )}
            </span>
          </td>

          <td>

            <a
              class="whatsapp"
              href="https://wa.me/91${phone}?text=${whatsappMessage}"
              target="_blank"
              rel="noopener"
            >
              WhatsApp
            </a>

            <br>

            <button
              class="arrived"
              onclick="
              updateStatus(
                ${booking.id},
                'Arrived'
              )
              "
            >
              Arrived
            </button>

            <button
              class="playing"
              onclick="
              updateStatus(
                ${booking.id},
                'Playing'
              )
              "
            >
              Playing
            </button>

            <button
              class="completed"
              onclick="
              updateStatus(
                ${booking.id},
                'Completed'
              )
              "
            >
              Done
            </button>

            <button
              class="cancel"
              onclick="
              updateStatus(
                ${booking.id},
                'Cancelled'
              )
              "
            >
              Cancel
            </button>

          </td>

        </tr>
        `;

      }
    );


    todayList.innerHTML =
      html;

  }


  /*
    SHOW ALL BOOKINGS
  */

  function renderAllBookings(
    bookings
  ) {

    const allList =
      document
        .getElementById(
          "allList"
        );


    if (
      bookings.length === 0
    ) {

      allList.innerHTML =

        `
        <tr>
          <td
            colspan="5"
          >
            No bookings found.
          </td>
        </tr>
        `;

      return;

    }


    let html = "";


    bookings.forEach(
      booking => {

        html +=

        `
        <tr>

          <td>
            ${formatDate(
              booking.booking_date
            )}
          </td>

          <td>
            ${escapeHtml(
              booking.booking_time
            )}
          </td>

          <td>
            ${escapeHtml(
              booking.customer_name
            )}
          </td>

          <td>
            ${escapeHtml(
              String(
                booking.phone
              )
            )}
          </td>

          <td>
            <span
              class="
              status
              ${statusClass(
                booking.status
              )}
              "
            >
              ${escapeHtml(
                booking.status ||
                "Booked"
              )}
            </span>
          </td>

        </tr>
        `;

      }
    );


    allList.innerHTML =
      html;

  }


  /*
    UPDATE BOOKING STATUS
  */

  async function updateStatus(
    id,
    newStatus
  ) {

    const confirmed =
      confirm(

        `Change this booking status to "${newStatus}"?`

      );


    if (
      !confirmed
    ) {

      return;

    }


    showMessage(

      "Updating booking status...",

      "success"

    );


    const {
      data,
      error
    } = await db

      .from("bookings")

      .update({

        status:
          newStatus

      })

      .eq(
        "id",
        id
      )

      .select();


    if (error) {

      console.error(

        "Update error:",

        error

      );


      showMessage(

        "Status update failed: " +
        escapeHtml(
          error.message
        ),

        "error"

      );


      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      showMessage(

        "No booking was updated. Please refresh and try again.",

        "error"

      );


      return;

    }


    showMessage(

      `Booking status changed to "${newStatus}".`,

      "success"

    );


    await loadBookings();

  }


  /*
    HELPER FUNCTIONS
  */

  function getLocalDate() {

    const now =
      new Date();


    const year =
      now.getFullYear();


    const month =
      String(
        now.getMonth() + 1
      )
      .padStart(
        2,
        "0"
      );


    const day =
      String(
        now.getDate()
      )
      .padStart(
        2,
        "0"
      );


    return (
      year +
      "-" +
      month +
      "-" +
      day
    );

  }


  function formatDate(
    dateValue
  ) {

    if (
      !dateValue
    ) {

      return "";

    }


    const parts =
      dateValue
      .split("-");


    if (
      parts.length !== 3
    ) {

      return dateValue;

    }


    return (
      parts[2] +
      "-" +
      parts[1] +
      "-" +
      parts[0]
    );

  }


  function statusClass(
    status
  ) {

    if (
      status ===
      "Cancelled"
    ) {

      return (
        "status-cancelled"
      );

    }


    if (
      status ===
      "Completed"
    ) {

      return (
        "status-completed"
      );

    }


    if (
      status ===
      "Playing"
    ) {

      return (
        "status-playing"
      );

    }


    if (
      status ===
      "Arrived"
    ) {

      return (
        "status-arrived"
      );

    }


    return "";

  }


  function showMessage(
    text,
    type
  ) {

    const message =
      document
        .getElementById(
          "message"
        );


    message.innerHTML =
      text;


    message.className =
      "message " +
      type;


    message.style.display =
      "block";


    if (
      type ===
      "success"
    ) {

      setTimeout(

        function() {

          message.style.display =
            "none";

        },

        2500

      );

    }

  }


  function showLoginMessage(
    text,
    type
  ) {

    const message =
      document
        .getElementById(
          "loginMessage"
        );


    message.innerHTML =
      text;


    message.className =
      "message " +
      type;


    message.style.display =
      "block";

  }


  function escapeHtml(
    value
  ) {

    const element =
      document.createElement(
        "div"
      );


    element.textContent =
      value ??
      "";


    return (
      element.innerHTML
    );

  }

</script>

</body>
</html>
