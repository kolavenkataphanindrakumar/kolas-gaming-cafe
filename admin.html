<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kola's Gaming Cafe Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f8;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1,h2{
text-align:center;
}

input,button{
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
cursor:pointer;
background:#161b22;
color:white;
}

.login{
text-align:center;
}

.summary{
background:#f1f3f5;
padding:15px;
border-radius:10px;
margin:20px 0;
font-size:18px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#161b22;
color:white;
}

.whatsapp{
background:#25D366;
}

.status{
margin:3px;
font-size:12px;
}

.cancel{
background:#d9534f;
}

</style>

</head>

<body>

<div class="container">

<h1>🎮 Kola's Gaming Cafe</h1>


<div id="loginBox" class="login">

<h3>Owner Login</h3>

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>



<div id="dashboard" style="display:none;">


<div class="summary" id="summary">
Loading...
</div>


<h2>Today's Bookings</h2>


<table>

<thead>
<tr>
<th>Time</th>
<th>Name</th>
<th>Phone</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="todayList"></tbody>

</table>



<h2>All Bookings</h2>


<table>

<thead>
<tr>
<th>Date</th>
<th>Time</th>
<th>Name</th>
<th>Phone</th>
<th>Status</th>
</tr>
</thead>

<tbody id="allList"></tbody>

</table>


</div>


</div>



<script>


const SUPABASE_URL =
"https://kjmovuvkfpqxbpgjscxb.supabase.co";


const SUPABASE_KEY =
"sb_publishable_jIkmH9FJEJ3ITWovdQvYmw_IDSkSeT2";


const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
  auth: {
    persistSession: false,
    autoRefreshToken: false,
    detectSessionInUrl: false
  }
}
);



const ADMIN_PASSWORD =
"phani";



function login(){

let p =
document.getElementById("password").value;


if(p===ADMIN_PASSWORD){

document.getElementById("loginBox").style.display="none";

document.getElementById("dashboard").style.display="block";

loadBookings();

}

else{

alert("Wrong password");

}

}



async function loadBookings(){


const {data,error}=await db
.from("bookings")
.select("*")
.order("booking_date")
.order("booking_time");



if(error){

alert(error.message);

return;

}



let today =
new Date()
.toISOString()
.split("T")[0];



let todayBookings =
data.filter(x =>
x.booking_date===today
);



let revenue =
todayBookings
.filter(x =>
x.status!=="Cancelled"
)
.length * 150;



document.getElementById("summary").innerHTML=
`
Today's bookings: <b>${todayBookings.length}</b><br>
Today's expected revenue: <b>₹${revenue}</b>
`;



let todayHTML="";


todayBookings.forEach(b=>{


todayHTML+=`

<tr>

<td>${b.booking_time}</td>

<td>${b.customer_name}</td>

<td>${b.phone}</td>

<td>${b.status}</td>

<td>

<a class="whatsapp button"
href="https://wa.me/91${b.phone}"
target="_blank">
WhatsApp
</a>

<br>

<button onclick="updateStatus(${b.id},'Arrived')">
Arrived
</button>

<button onclick="updateStatus(${b.id},'Playing')">
Playing
</button>

<button onclick="updateStatus(${b.id},'Completed')">
Done
</button>

<button class="cancel"
onclick="updateStatus(${b.id},'Cancelled')">
Cancel
</button>


</td>

</tr>

`;

});


document.getElementById("todayList").innerHTML=
todayHTML || "<tr><td colspan='5'>No bookings today</td></tr>";



let allHTML="";


data.forEach(b=>{


allHTML+=`

<tr>

<td>${b.booking_date}</td>

<td>${b.booking_time}</td>

<td>${b.customer_name}</td>

<td>${b.phone}</td>

<td>${b.status}</td>

</tr>

`;

});


document.getElementById("allList").innerHTML=
allHTML;


}



async function updateStatus(id,status){


const {error}=await db
.from("bookings")
.update({
status:status
})
.eq("id",id);



if(error){

alert(error.message);

return;

}


loadBookings();


}


</script>


</body>

</html>
